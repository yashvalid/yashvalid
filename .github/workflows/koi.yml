name: Koi

    on:
      schedule:
        # Runs shortly after midnight UTC
        - cron: "20 0 * * *"
      workflow_dispatch:
      push:
        paths: [.github/workflows/koi.yml]

    permissions:
      contents: write

    concurrency: koi

    jobs:
      koi:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: yashvalid/git-koi@main
            with:
              body: white # Choices: white, black, asagi, tea, gold, platinum
              output-dir: koi

          - name: Commit the koi if changed
            shell: bash
            run: |
              git add koi/koi.gif
              if git diff --cached --quiet; then
                echo "The koi is unchanged; nothing to commit."
                exit 0
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit --quiet --message "koi: draw the cosmic day's koi"
              git push --quiet
