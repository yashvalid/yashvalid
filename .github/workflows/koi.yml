name: Generate Koi Fish Profile Animation

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Koi Animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/index.js --username ${{ github.repository_owner }} --output koi.svg

      - name: Commit and push updated Koi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koi.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎏 Update Koi pond commit animation [skip ci]"
            git push
          fi
